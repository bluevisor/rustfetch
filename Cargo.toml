[package]
name = "rustfetch"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "rustfetch"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.59", features = ["derive"] }
colored = "3.1.1"
dirs = "6.0.0"
libc = "0.2.180"
serde = { version = "1.0.228", features = ["derive"] }
sysinfo = "0.37.2"
toml = "0.9.12"

# Already in Cargo.lock through sysinfo and display-info, used directly for IOKit (GPU, battery),
# CoreGraphics (screens) and the Objective-C runtime (the Wi-Fi name, through Foundation and a
# CoreWLAN that is only opened when needed). objc2 links Foundation, CoreGraphics loads it anyway
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.3", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2",
    "CFBase",
    "CFData",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "CGDirectDisplay",
    "CGDisplayConfiguration",
    "CGError",
] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "libc"] }

# macOS reads displays straight from CoreGraphics, display-info would pull in AppKit (~13 ms), and
# its GPU comes from IOKit so wgpu (Linux's cached fallback for the GPU name) isn't needed either
[target.'cfg(not(target_os = "macos"))'.dependencies]
display-info = "0.5.7"
pollster = "0.4.0"
wgpu = "28.0.0"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "symbols"
